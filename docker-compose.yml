
include:
  - docker-compose.core.yml
  - docker-compose.switch.yml

networks:
  core-net:
    driver: bridge
    name: banquito-core-net
    driver_opts:
      com.docker.network.driver.mtu: 1460
  switch-net:
    driver: bridge
    name: banquito-switch-net
    driver_opts:
      com.docker.network.driver.mtu: 1460
  observability-net:
    driver: bridge
    name: banquito-observability-net
    driver_opts:
      com.docker.network.driver.mtu: 1460

volumes:
  rabbitmq-data:
  loki-data:
  grafana-data:
  konga-data:

services:


  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: banquito
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_DEFAULT_VHOST: banquito
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  notification-service:
    image: ${NOTIFICATION_IMAGE:-ghcr.io/banco-banquito/notification-service:latest}
    container_name: notification-service
    restart: unless-stopped
    environment:
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-notificacionbanquito@gmail.com}"
      SMTP_PASS: "${SMTP_PASS}"
      SERVER_PORT: "8089"
      MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/banquito"
      SMTP_ENABLED: "true"
    ports:
      - "8089:8089"
    networks:
      - switch-net
      - core-net


  operador-frontend:
    image: ${OPERADOR_FRONTEND_IMAGE:-ghcr.io/banco-banquito/operador-frontend:latest}
    container_name: operador-frontend
    restart: unless-stopped
    ports:
      - "3004:8080"
    networks:
      - core-net
      - switch-net


  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability-net

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - observability-net
    depends_on:
      - loki


  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.45"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DOCKER_CONFIG_PATH:-/home/anahyyherrera/.docker/config.json}:/config.json:ro"
    command: --interval 60 --cleanup
    networks:
      - core-net


  konga:
    image: pantsel/konga:latest
    container_name: konga
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_ADAPTER: sqlite3
      DB_DATABASE: /app/kongadata/konga.db
    volumes:
      - konga-data:/app/kongadata
    ports:
      - "1337:1337"
    networks:
      - core-net
      - switch-net
