version: '3.9'

# ══════════════════════════════════════════════════════════════════════════════
# BanQuito V2 — Infraestructura Local
#
# UN solo PostgreSQL (puerto 5432) con 5 bases de datos adentro
# UN solo MongoDB    (puerto 27017) con 4 bases de datos adentro
#
# Comandos útiles:
#   docker-compose up -d                          → levanta TODO
#   docker-compose up -d postgres mongo rabbitmq  → solo infraestructura (para desarrollar localmente)
#   docker-compose down                           → apaga (preserva datos)
#   docker-compose down -v                        → apaga y borra todos los datos
# ══════════════════════════════════════════════════════════════════════════════

networks:
  core-net:
    driver: bridge
    name: banquito-core-net
  switch-net:
    driver: bridge
    name: banquito-switch-net

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:

services:

# ── POSTGRESQL — una instancia, múltiples bases de datos ──────────────────────
# Bases de datos que crea automáticamente al arrancar (via db/init-postgres.sql):
#   accountdb    → Oscar  (account-core-service)
#   accountingdb → Bryan  (accounting-service)
#   partydb      → Santiago (party-service)
#   filedb       → Alan   (file-reception-service)
#   tariffdb     → Johan  (tariff-service)

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banquito
      POSTGRES_PASSWORD: banquito123
      POSTGRES_DB: accountdb           # primera BD — las demás las crea init-postgres.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro    # ejecuta 01-11 en orden al primer arranque
    ports:
      - "5433:5432"
    networks:
      - core-net
      - switch-net                      # Alan y Johan (switch) también usan postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banquito -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# ── MONGODB — una instancia, múltiples bases de datos ─────────────────────────
# Las bases de datos se crean solas cuando cada micro arranca por primera vez:
#   routingdb   → Paul    (routing-service)
#   filedb      → Alan    (file-reception-service)
#   clearingdb  → Johan   (clearinghouse-adapter)
#   reportdb    → Anthony (report-service)

  mongo:
    image: mongo:8.0.8
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── RABBITMQ ──────────────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: banquito
      RABBITMQ_DEFAULT_PASS: banquito123
      RABBITMQ_DEFAULT_VHOST: banquito
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"                   # Management UI: http://localhost:15672
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# ── KONG API GATEWAY ──────────────────────────────────────────────────────────
# kong-core está en AMBAS redes: core-net y switch-net
# → Permite que routing-service y clearinghouse lo alcancen con http://kong-core:8000

  kong-core:
    image: kong:3.6
    container_name: kong-core
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/core/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"                     # Proxy: http://localhost:8000
      - "8001:8001"                     # Admin:  http://localhost:8001
    networks:
      - core-net
      - switch-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kong-switch:
    image: kong:3.6
    container_name: kong-switch
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/switch/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8010:8000"                     # Proxy: http://localhost:8010
      - "8011:8001"                     # Admin:  http://localhost:8011
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── MICROSERVICIOS CORE ───────────────────────────────────────────────────────

  account-core-service:
    image: ${ACCOUNT_CORE_IMAGE:-ghcr.io/banco-banquito/account-core-service:latest}
    container_name: account-core-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/accountdb
      DB_USER: banquito
      DB_PASS: banquito123
      ACCOUNTING_SERVICE_URL: http://accounting-service:8082
      PARTY_SERVICE_URL: http://party-service:8083
      CUT_OFF_TIME: "20:00"
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    networks:
      - core-net
    depends_on:
      postgres:
        condition: service_healthy

  accounting-service:
    image: ${ACCOUNTING_IMAGE:-ghcr.io/banco-banquito/accounting-service:latest}
    container_name: accounting-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/accountingdb
      DB_USER: banquito
      DB_PASS: banquito123
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"
    networks:
      - core-net
    depends_on:
      postgres:
        condition: service_healthy

  party-service:
    image: ${PARTY_IMAGE:-ghcr.io/banco-banquito/party-service:latest}
    container_name: party-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/partydb
      DB_USER: banquito
      DB_PASS: banquito123
      SERVER_PORT: "8083"
      ACCOUNT_CORE_GRPC_HOST: account-core-service
      ACCOUNT_CORE_GRPC_PORT: "9091"
    ports:
      - "8083:8083"
    networks:
      - core-net
    depends_on:
      postgres:
        condition: service_healthy

# ── MICROSERVICIOS SWITCH ─────────────────────────────────────────────────────

  file-reception-service:
    image: ${FILE_RECEPTION_IMAGE:-ghcr.io/banco-banquito/file-reception-service:latest}
    container_name: file-reception-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/filedb
      DB_USER: banquito
      DB_PASS: banquito123
      MONGODB_URI: mongodb://mongo:27017/filedb
      RABBITMQ_URL: amqp://banquito:banquito123@rabbitmq:5672/banquito
      ROUTING_QUEUE: payment.lines.queue
      CUT_OFF_TIME: "18:00"
      SERVER_PORT: "8084"
    ports:
      - "8084:8084"
    networks:
      - switch-net
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  routing-service:
    image: ${ROUTING_IMAGE:-ghcr.io/banco-banquito/routing-service:latest}
    container_name: routing-service
    restart: on-failure
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/routingdb
      SPRING_MONGODB_URI: mongodb://mongo:27017/routingdb
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: banquito
      RABBITMQ_PASSWORD: banquito123
      SPRING_RABBITMQ_VIRTUAL_HOST: banquito
      RABBITMQ_QUEUE: payment.lines.queue
      RABBITMQ_CLEARING_QUEUE: clearing.outbound.queue
      ACCOUNT_CORE_GRPC_HOST: kong-core
      ACCOUNT_CORE_GRPC_PORT: "8000"
      TARIFF_SERVICE_GRPC_HOST: tariff-service
      TARIFF_SERVICE_GRPC_PORT: "9091"
      NOTIFICATION_SERVICE_GRPC_HOST: notification-service
      NOTIFICATION_SERVICE_GRPC_PORT: "9092"
      SERVER_PORT: "8085"
    ports:
      - "8085:8085"
    networks:
      - switch-net
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tariff-service:
    image: ${TARIFF_IMAGE:-ghcr.io/banco-banquito/tariff-service:latest}
    container_name: tariff-service
    restart: on-failure
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/tariffdb
      POSTGRES_USER: banquito
      POSTGRES_PASSWORD: banquito123
      SERVER_PORT: "8086"
    ports:
      - "8086:8086"
    networks:
      - switch-net
    depends_on:
      postgres:
        condition: service_healthy

  clearinghouse-adapter:
    image: ${CLEARINGHOUSE_IMAGE:-ghcr.io/banco-banquito/clearinghouse-adapter:latest}
    container_name: clearinghouse-adapter
    restart: on-failure
    environment:
      SPRING_MONGODB_HOST: mongo
      SPRING_MONGODB_PORT: "27017"
      SPRING_MONGODB_DATABASE: clearingdb
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: banquito
      SPRING_RABBITMQ_PASSWORD: banquito123
      SPRING_RABBITMQ_VIRTUAL_HOST: banquito
      RABBITMQ_CLEARING_QUEUE: clearing.outbound.queue
      ACCOUNTING_SERVICE_URL: http://accounting-service:8082/api/v2/accounting/entries
      SERVER_PORT: "8087"
    ports:
      - "8087:8087"
    networks:
      - switch-net
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  report-service:
    image: ${REPORT_IMAGE:-ghcr.io/banco-banquito/report-service:latest}
    container_name: report-service
    restart: on-failure
    environment:
      MONGODB_URI: mongodb://mongo:27017/routingdb    # lee la BD de Paul, solo lectura
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      SERVER_PORT: "8088"
    ports:
      - "8088:8088"
    networks:
      - switch-net
    depends_on:
      mongo:
        condition: service_healthy

  notification-service:
    image: ${NOTIFICATION_IMAGE:-ghcr.io/banco-banquito/notification-service:latest}
    container_name: notification-service
    restart: on-failure
    environment:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: banquito.notificaciones@gmail.com
      SMTP_PASS: ${SMTP_PASS:-cambiar-por-app-password}
      SERVER_PORT: "8089"
    ports:
      - "8089:8089"
    networks:
      - switch-net

# ── AUTH SERVICE (simulación de microservicio de autenticación) ───────────────
# Emite JWT firmados con HS256. Kong valida cada token sin llamar de vuelta a este servicio.
# POST http://localhost:8000/api/v2/auth/login  (vía Kong Core)
# POST http://localhost:8010/api/v2/auth/login  (vía Kong Switch)
# Usuarios: admin/admin123 · teller/teller123 · empresa1/empresa123 · cliente1/cliente123

  auth-service:
    image: ${AUTH_IMAGE:-banquito/auth-service:local}
    container_name: auth-service
    restart: on-failure
    ports:
      - "8090:8090"
    networks:
      - core-net
      - switch-net

# ── FRONTENDS ─────────────────────────────────────────────────────────────────

  teller-frontend:
    image: ${TELLER_FRONTEND_IMAGE:-ghcr.io/banco-banquito/teller-frontend:latest}
    container_name: teller-frontend
    restart: on-failure
    ports:
      - "3001:80"
    networks:
      - core-net

  web-personas-frontend:
    image: ${WEB_PERSONAS_IMAGE:-ghcr.io/banco-banquito/web-personas-frontend:latest}
    container_name: web-personas-frontend
    restart: on-failure
    ports:
      - "3002:80"
    networks:
      - core-net

  web-empresas-frontend:
    image: ${WEB_EMPRESAS_IMAGE:-ghcr.io/banco-banquito/web-empresas-frontend:latest}
    container_name: web-empresas-frontend
    restart: on-failure
    ports:
      - "3003:80"
    networks:
      - switch-net
