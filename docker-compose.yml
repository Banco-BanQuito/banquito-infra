# ══════════════════════════════════════════════════════════════════════════════
# BanQuito V2 — Infraestructura compartida
#
# Core y Switch son bounded contexts independientes: sus microservicios y
# frontends propios viven en docker-compose.core.yml y docker-compose.switch.yml
# respectivamente (no se mezclan). Este archivo solo define lo genuinamente
# transversal a ambos dominios (broker, notificaciones, auth, observabilidad)
# e incluye los otros dos archivos para que "docker compose up" siga
# levantando el sistema completo con un solo comando.
#
# Bases de datos: Cloud SQL (PostgreSQL) y MongoDB Atlas  → env vars en .env
# Broker:         RabbitMQ                                → contenedor Docker
#
# Comandos:
#   cp .env.example .env        → llena con credenciales reales
#   docker compose up -d        → levanta todo (Core + Switch + compartido)
#   docker compose down         → apaga (sin borrar datos)
# ══════════════════════════════════════════════════════════════════════════════

include:
  - docker-compose.core.yml
  - docker-compose.switch.yml

networks:
  core-net:
    driver: bridge
    name: banquito-core-net
    driver_opts:
      com.docker.network.driver.mtu: 1460
  switch-net:
    driver: bridge
    name: banquito-switch-net
    driver_opts:
      com.docker.network.driver.mtu: 1460
  observability-net:
    driver: bridge
    name: banquito-observability-net
    driver_opts:
      com.docker.network.driver.mtu: 1460

volumes:
  rabbitmq-data:
  loki-data:
  grafana-data:

services:

# ── RABBITMQ ──────────────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: banquito
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_DEFAULT_VHOST: banquito
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  notification-service:
    image: ${NOTIFICATION_IMAGE:-ghcr.io/banco-banquito/notification-service:latest}
    container_name: notification-service
    restart: unless-stopped
    environment:
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-notificacionbanquito@gmail.com}"
      SMTP_PASS: "${SMTP_PASS}"
      SERVER_PORT: "8089"
      MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/banquito"
      SMTP_ENABLED: "true"
    ports:
      - "8089:8089"
    networks:
      - switch-net
      - core-net


# ── AUTH SERVICE ──────────────────────────────────────────────────────────────

  auth-service:
    image: ${AUTH_IMAGE:-ghcr.io/banco-banquito/auth-service:latest}
    container_name: auth-service
    restart: unless-stopped
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISS: "${JWT_ISS}"
      ACCOUNT_CORE_URL: http://account-core-service:8081
      PARTY_SERVICE_URL: http://party-service:8083
    ports:
      - "8090:8090"
    networks:
      - core-net
      - switch-net

# ── FRONTEND TRANSVERSAL (usa pantallas de Core y de Switch) ─────────────────

  operador-frontend:
    image: ${OPERADOR_FRONTEND_IMAGE:-ghcr.io/banco-banquito/operador-frontend:latest}
    container_name: operador-frontend
    restart: unless-stopped
    ports:
      - "3004:8080"
    networks:
      - core-net
      - switch-net

# ── OBSERVABILIDAD — logs centralizados (Loki + Promtail + Grafana) ───────────

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability-net

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - observability-net
    depends_on:
      - loki

# ── WATCHTOWER — auto-pull de nuevas imágenes ─────────────────────────────────

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.45"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DOCKER_CONFIG_PATH:-/home/anahyyherrera/.docker/config.json}:/config.json:ro"
    command: --interval 60 --cleanup
    networks:
      - core-net
