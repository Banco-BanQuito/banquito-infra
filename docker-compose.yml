# ══════════════════════════════════════════════════════════════════════════════
# BanQuito V2 — Infraestructura
#
# Bases de datos: Cloud SQL (PostgreSQL) y MongoDB Atlas  → env vars en .env
# Broker:         RabbitMQ                                → contenedor Docker
#
# Comandos:
#   cp .env.example .env        → llena con credenciales reales
#   docker compose up -d        → levanta todo
#   docker compose down         → apaga (sin borrar datos)
# ══════════════════════════════════════════════════════════════════════════════

networks:
  core-net:
    driver: bridge
    name: banquito-core-net
  switch-net:
    driver: bridge
    name: banquito-switch-net

volumes:
  rabbitmq-data:

services:

# ── RABBITMQ ──────────────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: banquito
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_DEFAULT_VHOST: banquito
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# ── KONG API GATEWAY ──────────────────────────────────────────────────────────

  kong-core:
    image: kong:3.6
    container_name: kong-core
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/core/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - core-net
      - switch-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kong-switch:
    image: kong:3.6
    container_name: kong-switch
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/switch/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8010:8000"
      - "8011:8001"
    networks:
      - switch-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── MICROSERVICIOS CORE ───────────────────────────────────────────────────────

  account-core-service:
    image: ${ACCOUNT_CORE_IMAGE:-ghcr.io/banco-banquito/account-core-service:latest}
    container_name: account-core-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://${CLOUD_SQL_HOST}:5432/accountdb
      DB_USER: ${CLOUD_DB_USER}
      DB_PASS: ${CLOUD_DB_PASS}
      ACCOUNTING_SERVICE_URL: http://accounting-service:8082
      PARTY_SERVICE_URL: http://party-service:8083
      CUT_OFF_TIME: "20:00"
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://${VM_PUBLIC_IP}:3001,http://${VM_PUBLIC_IP}:3002,http://${VM_PUBLIC_IP}:3003"
    ports:
      - "8081:8081"
    networks:
      - core-net

  accounting-service:
    image: ${ACCOUNTING_IMAGE:-ghcr.io/banco-banquito/accounting-service:latest}
    container_name: accounting-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://${CLOUD_SQL_HOST}:5432/accountingdb
      DB_USER: ${CLOUD_DB_USER}
      DB_PASS: ${CLOUD_DB_PASS}
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports:
      - "8082:8082"
    networks:
      - core-net

  party-service:
    image: ${PARTY_IMAGE:-ghcr.io/banco-banquito/party-service:latest}
    container_name: party-service
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://${CLOUD_SQL_HOST}:5432/partydb
      DB_USER: ${CLOUD_DB_USER}
      DB_PASS: ${CLOUD_DB_PASS}
      SERVER_PORT: "8083"
      ACCOUNT_CORE_GRPC_HOST: account-core-service
      ACCOUNT_CORE_GRPC_PORT: "9091"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3002,http://${VM_PUBLIC_IP}:3002,http://${VM_PUBLIC_IP}:3001,http://${VM_PUBLIC_IP}:3003"
    ports:
      - "8083:8083"
    networks:
      - core-net

# ── MICROSERVICIOS SWITCH ─────────────────────────────────────────────────────

  file-reception-service:
    image: ${FILE_RECEPTION_IMAGE:-ghcr.io/banco-banquito/file-reception-service:latest}
    container_name: file-reception-service
    restart: on-failure
    environment:
      POSTGRES_HOST: "${CLOUD_SQL_HOST}"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "filedb"
      POSTGRES_USER: "${CLOUD_DB_USER}"
      POSTGRES_PASSWORD: "${CLOUD_DB_PASS}"
      MONGO_URI: "mongodb+srv://${MONGO_ATLAS_URL}/filedb"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "banquito"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASS}"
      RABBITMQ_VHOST: "banquito"
      ROUTING_QUEUE: payment.lines.queue
      CUT_OFF_TIME: "18:00"
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports:
      - "8084:8084"
    networks:
      - switch-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  routing-service:
    image: ${ROUTING_IMAGE:-ghcr.io/banco-banquito/routing-service:latest}
    container_name: routing-service
    restart: on-failure
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/routingdb"
      SPRING_MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/routingdb"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: banquito
      RABBITMQ_PASSWORD: "${RABBITMQ_PASS}"
      SPRING_RABBITMQ_VIRTUAL_HOST: banquito
      RABBITMQ_QUEUE: payment.lines.queue
      RABBITMQ_CLEARING_QUEUE: clearing.outbound.queue
      ACCOUNT_CORE_GRPC_HOST: kong-core
      ACCOUNT_CORE_GRPC_PORT: "8000"
      TARIFF_SERVICE_GRPC_HOST: tariff-service
      TARIFF_SERVICE_GRPC_PORT: "9091"
      NOTIFICATION_SERVICE_GRPC_HOST: notification-service
      NOTIFICATION_SERVICE_GRPC_PORT: "9092"
      SERVER_PORT: "8085"
    ports:
      - "8085:8085"
    networks:
      - switch-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  tariff-service:
    image: ${TARIFF_IMAGE:-ghcr.io/banco-banquito/tariff-service:latest}
    container_name: tariff-service
    restart: on-failure
    environment:
      POSTGRES_URL: jdbc:postgresql://${CLOUD_SQL_HOST}:5432/tariffdb
      POSTGRES_USER: ${CLOUD_DB_USER}
      POSTGRES_PASSWORD: ${CLOUD_DB_PASS}
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports:
      - "8086:8086"
    networks:
      - switch-net

  clearinghouse-adapter:
    image: ${CLEARINGHOUSE_IMAGE:-ghcr.io/banco-banquito/clearinghouse-adapter:latest}
    container_name: clearinghouse-adapter
    restart: on-failure
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/clearingdb"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: banquito
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASS}"
      SPRING_RABBITMQ_VIRTUAL_HOST: banquito
      RABBITMQ_CLEARING_QUEUE: clearing.outbound.queue
      ACCOUNTING_SERVICE_URL: http://accounting-service:8082/api/v2/accounting/entries
      SERVER_PORT: "8087"
    ports:
      - "8087:8087"
    networks:
      - switch-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-service:
    image: ${REPORT_IMAGE:-ghcr.io/banco-banquito/report-service:latest}
    container_name: report-service
    restart: on-failure
    environment:
      MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/routingdb"
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      SERVER_PORT: "8088"
    ports:
      - "8088:8088"
    networks:
      - switch-net

  notification-service:
    image: ${NOTIFICATION_IMAGE:-ghcr.io/banco-banquito/notification-service:latest}
    container_name: notification-service
    restart: on-failure
    environment:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: banquito.notificaciones@gmail.com
      SMTP_PASS: "${SMTP_PASS}"
      SERVER_PORT: "8089"
    ports:
      - "8089:8089"
    networks:
      - switch-net


# ── AUTH SERVICE ──────────────────────────────────────────────────────────────

  auth-service:
    image: ${AUTH_IMAGE:-ghcr.io/banco-banquito/auth-service:latest}
    container_name: auth-service
    restart: on-failure
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISS: "${JWT_ISS}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      TELLER_PASSWORD: "${TELLER_PASSWORD}"
      EMPRESA_PASSWORD: "${EMPRESA_PASSWORD}"
      CLIENTE_PASSWORD: "${CLIENTE_PASSWORD}"
    ports:
      - "8090:8090"
    networks:
      - core-net
      - switch-net

# ── FRONTENDS ─────────────────────────────────────────────────────────────────

  teller-frontend:
    image: ${TELLER_FRONTEND_IMAGE:-ghcr.io/banco-banquito/teller-frontend:latest}
    container_name: teller-frontend
    restart: on-failure
    ports:
      - "3001:80"
    networks:
      - core-net

  web-personas-frontend:
    image: ${WEB_PERSONAS_IMAGE:-ghcr.io/banco-banquito/web-personas-frontend:latest}
    container_name: web-personas-frontend
    restart: on-failure
    ports:
      - "3002:80"
    networks:
      - core-net

  web-empresas-frontend:
    image: ${WEB_EMPRESAS_IMAGE:-ghcr.io/banco-banquito/web-empresas-frontend:latest}
    container_name: web-empresas-frontend
    restart: on-failure
    ports:
      - "3003:80"
    networks:
      - switch-net

# ── WATCHTOWER — auto-pull de nuevas imágenes ─────────────────────────────────

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.45"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/anahyyherrera/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup
    networks:
      - core-net
