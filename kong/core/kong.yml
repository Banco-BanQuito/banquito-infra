_format_version: "3.0"
_transform: true

plugins:

  - name: rate-limiting
    config:
      minute: 100
      limit_by: ip
      policy: local
      hide_client_headers: false

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

services:

  - name: account-core-service
    url: http://account-core-service:8081
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    routes:

      - name: auth-login-staff
        paths:
          - /api/v2/auth/login/staff
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: accounts-read
        paths:
          - /api/v2/accounts
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: accounts-write
        paths:
          - /api/v2/accounts
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: payments-batch-credit
        paths:
          - /api/v2/payments/batch-credit
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: payments-corporate-debit
        paths:
          - /api/v2/payments/corporate-debit
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

  - name: accounting-service
    url: http://accounting-service:8082
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    routes:

      - name: accounting-write
        paths:
          - /api/v2/accounting
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: accounting-read
        paths:
          - /api/v2/accounting
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

  - name: account-core-grpc
    protocol: grpc
    host: account-core-service
    port: 9091
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: grpc-account-core
        protocols: [grpc]
        paths:
          - /com.banquito.core.account.AccountCoreService

  - name: party-service
    url: http://party-service:8083
    connect_timeout: 10000
    write_timeout: 30000
    read_timeout: 30000
    routes:

      - name: auth-login-customer
        paths:
          - /api/v2/auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: auth-change-password
        paths:
          - /api/v2/auth/change-password
        methods:
          - PUT
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: customers-read
        paths:
          - /api/v2/customers
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: branches-read
        paths:
          - /api/v2/branches
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: customer-subtypes-read
        paths:
          - /api/v2/customer-subtypes
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: holidays-read
        paths:
          - /api/v2/holidays
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

      - name: core-parameters-read
        paths:
          - /api/v2/core-parameters
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false
