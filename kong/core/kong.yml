_format_version: "3.0"
_transform: true


consumers:
  - username: banquito-app
    jwt_secrets:
      - key: ${JWT_ISS}
        secret: ${JWT_SECRET}
        algorithm: HS256

services:

  - name: auth-service
    url: http://auth-service:8090
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: auth-login
        paths:
          - /api/v2/auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false

  - name: account-core-service
    url: http://account-core-service:8081
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          secret_is_base64: false
    routes:

      - name: accounts-read
        paths:
          - /api/v2/accounts
        methods:
          - GET
        strip_path: false
        preserve_host: false

      - name: accounts-write
        paths:
          - /api/v2/accounts
        methods:
          - POST
        strip_path: false
        preserve_host: false

      - name: payments-batch-credit
        paths:
          - /api/v2/payments/batch-credit
        methods:
          - POST
        strip_path: false
        preserve_host: false

      - name: payments-corporate-debit
        paths:
          - /api/v2/payments/corporate-debit
        methods:
          - POST
        strip_path: false
        preserve_host: false

  - name: accounting-service
    url: http://accounting-service:8082
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          secret_is_base64: false
    routes:

      - name: accounting-write
        paths:
          - /api/v2/accounting
        methods:
          - POST
        strip_path: false
        preserve_host: false

      - name: accounting-read
        paths:
          - /api/v2/accounting
        methods:
          - GET
        strip_path: false
        preserve_host: false

  - name: account-core-grpc
    protocol: grpc
    host: account-core-service
    port: 9091
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: grpc-account-core
        protocols: [grpc]
        paths:
          - /com.banquito.core.account.AccountCoreService

  - name: party-service
    url: http://party-service:8083
    connect_timeout: 10000
    write_timeout: 30000
    read_timeout: 30000
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          secret_is_base64: false
    routes:

      - name: customers-read
        paths:
          - /api/v2/customers
        methods:
          - GET
        strip_path: false
        preserve_host: false
