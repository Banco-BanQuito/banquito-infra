_format_version: "3.0"
_transform: true

plugins:

  - name: rate-limiting
    config:
      minute: 100
      limit_by: ip
      policy: local
      hide_client_headers: false

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

services:

  - name: file-reception-service
    url: http://file-reception-service:8084
    connect_timeout: 10000
    write_timeout: 120000
    read_timeout: 120000
    routes:

      - name: batches-upload
        paths:
          - /api/v2/payments/batches
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false
      - name: routing-codes-catalog
        paths:
          - /api/v2/payments/routing-codes
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        strip_path: false
        preserve_host: false
      - name: batch-status
        paths:
          - ~/api/v2/payments/batches/[^/]+/status$
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false
        regex_priority: 100

  - name: report-service
    url: http://report-service:8088
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    routes:

      - name: batch-report
        paths:
          - ~/api/v2/payments/batches/[^/]+/report$
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false
        regex_priority: 100

      - name: payment-receipts
        paths:
          - ~/api/v2/payments/receipts/[^/]+$
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false
        regex_priority: 100

      - name: payment-receipts-pdf
        paths:
          - ~/api/v2/payments/receipts/[^/]+/pdf$
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false
        regex_priority: 101

  - name: account-core-service
    url: http://account-core-service:8081
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: account-core-accounts
        paths:
          - /api/v2/accounts
        methods:
          - GET
          - OPTIONS
        strip_path: false
        preserve_host: false

  - name: clearinghouse-service
    url: http://clearinghouse-service:8087
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: clearinghouse-files
        paths:
          - /api/v2/clearing
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false
