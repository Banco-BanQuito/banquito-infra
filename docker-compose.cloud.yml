services:

  # ── Reemplaza postgres local con no-op (se usa Cloud SQL) ────────────────────
  postgres:
    image: alpine:3.19
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 2s
    restart: "no"

  # ── Reemplaza mongo local con no-op (se usa MongoDB Atlas) ──────────────────
  mongo:
    image: alpine:3.19
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 2s
    restart: "no"

  # ── Apunta servicios Core a Cloud SQL PostgreSQL ─────────────────────────────
  account-core-service:
    environment:
      DB_URL: jdbc:postgresql://136.112.87.173:5432/accountdb
      DB_USER: postgres
      DB_PASS: "Banquito123*"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

  accounting-service:
    environment:
      DB_URL: jdbc:postgresql://136.112.87.173:5432/accountingdb
      DB_USER: postgres
      DB_PASS: "Banquito123*"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

  party-service:
    environment:
      DB_URL: jdbc:postgresql://136.112.87.173:5432/partydb
      DB_USER: postgres
      DB_PASS: "Banquito123*"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

  # ── Apunta servicios Switch a Cloud SQL + MongoDB Atlas ──────────────────────
  file-reception-service:
    environment:
      POSTGRES_HOST: "136.112.87.173"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "filedb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "Banquito123*"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      MONGO_URI: "mongodb+srv://banquito:Banquito123%2A@banquito-cluster.ffdlgoy.mongodb.net/filedb"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "banquito"
      RABBITMQ_PASSWORD: "banquito123"
      RABBITMQ_VHOST: "banquito"

  routing-service:
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb+srv://banquito:Banquito123%2A@banquito-cluster.ffdlgoy.mongodb.net/routingdb"
      SPRING_MONGODB_URI: "mongodb+srv://banquito:Banquito123%2A@banquito-cluster.ffdlgoy.mongodb.net/routingdb"

  tariff-service:
    environment:
      POSTGRES_URL: jdbc:postgresql://136.112.87.173:5432/tariffdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Banquito123*"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

  clearinghouse-adapter:
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb+srv://banquito:Banquito123%2A@banquito-cluster.ffdlgoy.mongodb.net/clearingdb"

  report-service:
    environment:
      MONGODB_URI: "mongodb+srv://banquito:Banquito123%2A@banquito-cluster.ffdlgoy.mongodb.net/routingdb"

  # ── Watchtower — auto-actualiza contenedores cuando hay nuevas imágenes ───────
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.45"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/anahyyherrera/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup
    networks:
      - core-net
