# account-core-service — Oscar
# Copia esto a: src/main/resources/application.properties
# ══════════════════════════════════════════════════════════════════════════════

server.port=${SERVER_PORT:8081}

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accountdb}
spring.datasource.username=${DB_USER:banquito}
spring.datasource.password=${DB_PASS:banquito123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Comunicación con otros micros (URLs para desarrollo local)
accounting.service.url=${ACCOUNTING_SERVICE_URL:http://localhost:8082}
party.service.url=${PARTY_SERVICE_URL:http://localhost:8083}

# Horario de corte
cut.off.time=${CUT_OFF_TIME:20:00}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ──────────────────────────────────────────────────────────────────────────────
# NOTA: Cuando corres desde IntelliJ/VS Code usa localhost:5432
#       Cuando corres dentro de Docker el docker-compose inyecta DB_URL=jdbc:postgresql://postgres:5432/accountdb
# ──────────────────────────────────────────────────────────────────────────────
