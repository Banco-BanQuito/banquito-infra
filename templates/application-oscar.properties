
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accountdb}
spring.datasource.username=${DB_USER:banquito}
spring.datasource.password=${DB_PASS:banquito123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

accounting.service.url=${ACCOUNTING_SERVICE_URL:http://localhost:8082}
party.service.url=${PARTY_SERVICE_URL:http://localhost:8083}

cut.off.time=${CUT_OFF_TIME:20:00}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

