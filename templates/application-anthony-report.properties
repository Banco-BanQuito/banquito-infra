# report-service — Anthony
# Copia esto a: src/main/resources/application.properties
#
# IMPORTANTE: Este servicio lee la base de datos routingdb de PAUL (solo lectura).
# No tiene BD propia. Se conecta al mismo MongoDB pero a la BD de Paul.
# ══════════════════════════════════════════════════════════════════════════════

server.port=${SERVER_PORT:8088}

# MongoDB — BD de Paul (routingdb), solo lectura
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/routingdb}

# URL del notification-service
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
