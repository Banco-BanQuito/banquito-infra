# notification-service — Anthony
# Copia esto a: src/main/resources/application.properties
# Sin base de datos propia — solo SMTP
# ══════════════════════════════════════════════════════════════════════════════

server.port=${SERVER_PORT:8089}

# Configuración SMTP (Gmail)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:banquito.notificaciones@gmail.com}
spring.mail.password=${SMTP_PASS:cambiar-por-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
