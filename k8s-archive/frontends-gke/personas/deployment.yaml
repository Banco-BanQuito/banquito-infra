apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-personas-frontend
  namespace: banquito-frontend
  labels:
    app: personas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: personas
  template:
    metadata:
      labels:
        app: personas
    spec:
      containers:
        - name: web-personas-frontend
          image: us-central1-docker.pkg.dev/project-47695a8e-7cb2-4352-af2/banquito/web-personas-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: banquito-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi

