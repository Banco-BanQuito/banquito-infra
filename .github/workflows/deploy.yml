name: Deploy to GKE

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
  ARTIFACT_REGION: ${{ secrets.ARTIFACT_REGION }}
  ARTIFACT_REPOSITORY: ${{ secrets.ARTIFACT_REPOSITORY }}

jobs:
  deploy:
    name: Apply Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/69503932816/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-gke@project-47695a8e-7cb2-4352-af2.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Prepare manifests
        run: |
          set -euo pipefail
          cp -R k8s rendered-k8s

      - name: Validate manifests
        run: |
          kubectl create --dry-run=client --validate=false --recursive -f rendered-k8s

      - name: Apply manifests
        run: |
          kubectl apply --recursive -f rendered-k8s

      - name: Show services
        run: |
          kubectl get svc -A

      - name: Show pods
        run: |
          kubectl get pods -n banquito-core -o wide
          kubectl get pods -n banquito-switch -o wide
          kubectl get pods -n banquito-frontend -o wide

      - name: Show external access
        run: |
          kubectl get gateway -A
          kubectl get httproute -A
