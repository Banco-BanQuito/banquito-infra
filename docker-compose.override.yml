services:

  # ── Servicios que se construyen desde código local ────────────────────────

  account-core-service:
    build:
      context: ../banquito-account-core-service

  accounting-service:
    build:
      context: ../banquito-accounting-service
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21 AS builder
        WORKDIR /app
        COPY pom.xml .
        RUN mvn dependency:go-offline -q
        COPY src ./src
        RUN mvn package -DskipTests -q
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /app
        COPY --from=builder /app/target/*.jar app.jar
        EXPOSE 8082
        ENTRYPOINT ["java", "-jar", "app.jar"]

  routing-service:
    build:
      context: ../banquito-routing-service

  clearinghouse-adapter:
    build:
      context: ../banquito-clearinghouse-adapter/banquito-clearinghouse-adapter
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21-alpine AS builder
        WORKDIR /app
        COPY pom.xml .
        RUN mvn dependency:go-offline -q
        COPY src ./src
        RUN sed -i '/^spring\.jackson\./d' src/main/resources/application.properties
        RUN mvn package -DskipTests -q
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /app
        COPY --from=builder /app/target/*.jar app.jar
        EXPOSE 8087
        ENTRYPOINT ["java", "-jar", "app.jar"]

  tariff-service:
    build:
      context: ../banquito-tariff-service/banquito-tariff-service
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21-alpine AS builder
        WORKDIR /app
        COPY pom.xml .
        RUN mvn dependency:go-offline -q
        COPY src ./src
        RUN mvn package -DskipTests -q
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /app
        COPY --from=builder /app/target/*.jar app.jar
        EXPOSE 8086
        ENTRYPOINT ["java", "-jar", "app.jar"]

  party-service:
    build:
      context: ../banquito-party-service
      dockerfile_inline: |
        FROM maven:3.9-eclipse-temurin-21 AS builder
        WORKDIR /app
        COPY pom.xml .
        RUN mvn dependency:go-offline -q
        COPY src ./src
        RUN mvn package -DskipTests -q
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /app
        COPY --from=builder /app/target/*.jar app.jar
        EXPOSE 8083
        ENTRYPOINT ["java", "-jar", "app.jar"]

  file-reception-service:
    build:
      context: ../banquito-file-reception-service

  notification-service:
    build:
      context: ../banquito-notification-service

  report-service:
    build:
      context: ../banquito-report-service

  teller-frontend:
    build:
      context: ../banquito-teller-frontend

  web-empresas-frontend:
    build:
      context: ../banquito-web-empresas-frontend

  web-personas-frontend:
    build:
      context: ../banquito-web-personas-frontend

  # ── Auth service: construido desde infra/auth ─────────────────────────────
  auth-service:
    build:
      context: ./auth
