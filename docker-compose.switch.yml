
services:


  kong-switch:
    image: kong:3.6
    container_name: kong-switch
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://${VM_PUBLIC_IP}:8012"
      KONG_ADMIN_GUI_API_URL: "http://${VM_PUBLIC_IP}:8011"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/switch/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8010:8000"
      - "8011:8001"
      - "8012:8002"
    networks:
      - switch-net
      - core-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  file-reception-service:
    image: ${FILE_RECEPTION_IMAGE:-ghcr.io/banco-banquito/file-reception-service:latest}
    container_name: file-reception-service
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mysql://${CLOUD_MYSQL_HOST}:3306/filedb?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USER: "${CLOUD_MYSQL_USER}"
      DB_PASS: "${CLOUD_MYSQL_PASS}"
      MONGO_URI: "mongodb+srv://${MONGO_ATLAS_URL}/banquito"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "banquito"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASS}"
      RABBITMQ_VHOST: "banquito"
      APP_RABBIT_QUEUE_ONUS: payment.lines.onus.queue
      APP_RABBIT_QUEUE_OFFUS: payment.lines.offus.queue
      APP_RABBIT_QUEUE_INVALID: payment.lines.invalid.queue
      RABBITMQ_CLEARING_EXCHANGE: clearing.exchange
      RABBITMQ_CLEARING_ROUTING_KEY: clearing.outbound
      CUT_OFF_TIME: "18:00"
      APP_CUTOFF_HOUR: "23"
      SERVER_PORT: "8084"
      APP_CORE_VALIDATION_ENABLED: "false"
      APP_FORCE_BUSINESS_DAY: "true"
      CORE_GATEWAY_URL: "http://account-core-service:8081"
      CORPORATE_ACCOUNT_NUMBER: "0000000000"
      TARIFF_SERVICE_GRPC_HOST: tariff-service
      TARIFF_SERVICE_GRPC_PORT: "9090"
      NOTIFICATION_SERVICE_GRPC_HOST: notification-service
      NOTIFICATION_SERVICE_GRPC_PORT: "9092"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports:
      - "8084:8084"
    networks:
      - switch-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  tariff-service:
    image: ${TARIFF_IMAGE:-ghcr.io/banco-banquito/tariff-service:latest}
    container_name: tariff-service
    restart: unless-stopped
    environment:
      POSTGRES_URL: "jdbc:mysql://${CLOUD_MYSQL_HOST}:3306/tariffdb?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      POSTGRES_USER: ${CLOUD_MYSQL_USER}
      POSTGRES_PASSWORD: ${CLOUD_MYSQL_PASS}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    ports:
      - "8086:8086"
    networks:
      - switch-net

  clearinghouse-service:
    image: ${CLEARINGHOUSE_IMAGE:-ghcr.io/banco-banquito/clearinghouse-service:latest}
    container_name: clearinghouse-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/banquito"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: banquito
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASS}"
      SPRING_RABBITMQ_VIRTUAL_HOST: banquito
      RABBITMQ_CLEARING_QUEUE: clearing.outbound.queue
      CORE_GATEWAY_URL: http://account-core-service:8081
      SERVER_PORT: "8087"
      COMPENSATION_OUTPUT_DIR: /app/spi-output
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://${VM_PUBLIC_IP}:3001,http://${VM_PUBLIC_IP}:3002,http://${VM_PUBLIC_IP}:3003,http://${VM_PUBLIC_IP}:3004,http://${VM_PUBLIC_IP}:3005"
    ports:
      - "8087:8087"
    networks:
      - switch-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-service:
    image: ${REPORT_IMAGE:-ghcr.io/banco-banquito/report-service:latest}
    container_name: report-service
    restart: unless-stopped
    environment:
      MONGODB_URI: "mongodb+srv://${MONGO_ATLAS_URL}/banquito"
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      SERVER_PORT: "8088"
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://${VM_PUBLIC_IP}:3001,http://${VM_PUBLIC_IP}:3002,http://${VM_PUBLIC_IP}:3003,http://${VM_PUBLIC_IP}:3004,http://${VM_PUBLIC_IP}:3005"
    ports:
      - "8088:8088"
    networks:
      - switch-net
      - core-net


  web-empresas-frontend:
    image: ${WEB_EMPRESAS_IMAGE:-ghcr.io/banco-banquito/web-empresas-frontend:latest}
    container_name: web-empresas-frontend
    restart: unless-stopped
    ports:
      - "3003:8080"
    networks:
      - switch-net
