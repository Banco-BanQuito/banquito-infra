apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: banquito-switch
  labels:
    app: notification
spec:
  type: ClusterIP
  selector:
    app: notification
  ports:
    - name: http
      port: 8089
      targetPort: 8089
    - name: grpc
      port: 9092
      targetPort: 9092

