apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-reception-service-hpa
  namespace: banquito-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-reception-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
---
