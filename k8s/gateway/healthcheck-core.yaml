apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: account-core-healthcheck
  namespace: banquito-core
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 8081
        requestPath: /actuator/health
  targetRef:
    group: ""
    kind: Service
    name: account-core-service
---
