apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: banquito-public-gateway
  namespace: banquito-gateway
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
