apiVersion: v1
kind: Service
metadata:
  name: account-core-service
  namespace: banquito-core
  labels:
    app: account-core
spec:
  type: ClusterIP
  selector:
    app: account-core
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9091
      targetPort: 9091

