apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-line-subscriber-service
  namespace: banquito-pubsub
  labels:
    app: payment-line-subscriber
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-line-subscriber
  template:
    metadata:
      labels:
        app: payment-line-subscriber
    spec:
      serviceAccountName: payment-line-subscriber-pubsub-ksa
      containers:
        - name: payment-line-subscriber-service
          image: us-central1-docker.pkg.dev/project-47695a8e-7cb2-4352-af2/banquito/payment-line-subscriber-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: SERVER_PORT
              value: "8091"
            - name: SPRING_APPLICATION_NAME
              value: banquito-payment-line-subscriber-service
            - name: DB_URL
              value: "jdbc:mysql://136.111.132.119:3306/filedb"
            - name: DB_USER
              value: root
            - name: APP_EMBEDDED_ROUTER_ENABLED
              value: "false"
            - name: APP_DISPATCH_ENABLED
              value: "true"
            - name: APP_DISPATCH_ONUS_ENABLED
              value: "true"
            - name: APP_DISPATCH_OFFUS_ENABLED
              value: "true"
            - name: APP_DISPATCH_INVALID_ENABLED
              value: "true"
            - name: CLEARINGHOUSE_GRPC_HOST
              value: "clearinghouse-service.banquito-switch.svc.cluster.local"
            - name: CLEARINGHOUSE_GRPC_PORT
              value: "9094"
            - name: CLEARINGHOUSE_DIRECT_DELEGATION_ENABLED
              value: "true"
            - name: CLEARING_PUBSUB_FALLBACK_ENABLED
              value: "false"
            - name: INTERNAL_PAYMENT_PROCESSOR_GRPC_HOST
              value: "internal-payment-processor-service.banquito-pubsub.svc.cluster.local"
            - name: INTERNAL_PAYMENT_PROCESSOR_GRPC_PORT
              value: "9095"
          envFrom:
            - configMapRef:
                name: banquito-config
            - secretRef:
                name: file-reception-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 360
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi

