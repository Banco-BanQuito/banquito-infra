apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-line-publisher-service
  namespace: banquito-pubsub
  labels:
    app: payment-line-publisher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-line-publisher
  template:
    metadata:
      labels:
        app: payment-line-publisher
    spec:
      serviceAccountName: payment-line-publisher-pubsub-ksa
      containers:
        - name: payment-line-publisher-service
          image: us-central1-docker.pkg.dev/project-47695a8e-7cb2-4352-af2/banquito/payment-line-publisher-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8092
          env:
            - name: SERVER_PORT
              value: "8092"
            - name: SPRING_APPLICATION_NAME
              value: banquito-payment-line-publisher-service
            - name: APP_EMBEDDED_ROUTER_ENABLED
              value: "false"
            - name: APP_PAYMENT_LINE_CLASSIFIER_POLL_ENABLED
              value: "false"
            - name: APP_PAYMENT_LINE_PUBLISHER_POLL_ENABLED
              value: "true"
            - name: APP_DISPATCH_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: banquito-config
            - secretRef:
                name: file-reception-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 360
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
